# Panel — Databricks Asset Bundle
# Deploys the FastAPI server + the bundled web/ static frontend
# as a single Databricks App.

bundle:
  name: panel

workspace:
  host: https://dbc-3814f0dc-4c11.cloud.databricks.com

variables:
  app_name:
    description: Name of the Databricks App
    default: panel
  catalog:
    description: Unity Catalog
    default: panel
  schema:
    description: Schema name
    default: main
  lakebase:
    description: Lakebase instance name
    default: panel-db
  warehouse_id:
    description: Serverless SQL warehouse for Genie / SQL workloads
    default: 3bb8d46fd7cb0b0a
  genie_space_id:
    description: Genie Space — NL → SQL over labor codes / ILO standards
    default: 01f15002d16915548191d84deb5267ed

resources:
  apps:
    panel:
      name: ${var.app_name}
      description: "Panel — multi-agent rights advisor for APJ migrant workers"
      source_code_path: ${workspace.file_path}/app
      resources:
        - name: lakebase
          description: "Lakebase OLTP — session memory + case archive"
          database:
            instance_name: ${var.lakebase}
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: warehouse
          description: "SQL warehouse for catalog reads"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: model-haiku
          description: "Mosaic AI — fast agent inference"
          serving_endpoint:
            name: databricks-qwen3-next-80b-a3b-instruct
            permission: CAN_QUERY
        - name: model-sonnet
          description: "Mosaic AI — deeper reasoning when needed"
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY
        - name: genie
          description: "Genie Space for NL → SQL over reference tables"
          genie_space:
            name: Panel · Labor Law Q&A
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/baris@marketingdelphi.com/panel/prod
